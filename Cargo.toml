[package]
name = "musicfree"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Extract and download audio from Bilibili, YouTube, and direct URLs"
repository = "https://github.com/ahaoboy/musicfree"
homepage = "https://github.com/ahaoboy/musicfree"
authors = ["ahaoboy"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]
bindgen = ["ytdlp-ejs/bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
  "brotli",
  "deflate",
  "cookies",
] }
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
rand = "0.10"
thiserror = "2"
regex = "1"
url = "2"
urlencoding = "2"
md5 = "0.8"
abv = "0.3"
anyhow = { version = "1", optional = true }
async-trait = "0.1"
sanitize-filename = "0.6"
clap = { version = "4", features = ["derive"], optional = true }
serde-youtube = { git = "https://github.com/ahaoboy/serde-youtube.git", default-features = false }
serde-cookie = { git = "https://github.com/ahaoboy/serde-cookie", default-features = false, features = [
  "reqwest",
] }
ytdlp-ejs = { version = "0.1", git = "https://github.com/ahaoboy/ytdlp-ejs", default-features = false, features = [
  "quickjs-oxide",
] }

[profile.release]
debug = false
lto = true
strip = true
opt-level = 3
codegen-units = 1

[profile.bloaty]
debug = true
lto = false
strip = false
inherits = "release"

[[bin]]
name = "musicfree"
required-features = ["cli"]
